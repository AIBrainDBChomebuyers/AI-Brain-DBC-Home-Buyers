# Local development stack.
#
#   docker compose -f infra/docker-compose.yml up -d
#
# Postgres only. MongoDB was removed on 2026-09-13 when the design
# consolidated to one database — see docs/SINGLE_STORE_MIGRATION.md.
#
# This image is plain Postgres with pgvector, which is close enough to
# Supabase for local work: the schema, the policies and the queries are
# identical. What it cannot reproduce is Supabase's role setup, so verify
# anything touching BYPASSRLS against the real project rather than here.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dbc-postgres
    environment:
      POSTGRES_DB: ai_brain
      # The owner role. The API does NOT connect as this — it connects as
      # ai_brain_app, which 003_enable_rls.sql creates with SELECT only.
      POSTGRES_USER: ai_brain_owner
      POSTGRES_PASSWORD: ${PG_OWNER_PASSWORD:-devonly}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_brain_owner -d ai_brain"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: dbc-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-devonly}
    ports:
      - "8080:8080"

  minio:
    image: minio/minio:latest
    container_name: dbc-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
